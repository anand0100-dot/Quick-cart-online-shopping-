<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Order</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>

        #map{

            height:500px;

            width:100%;

            border-radius:10px;

            box-shadow:0px 0px 10px gray;

        }

    </style>

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                🛒 QuickCart
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="products.html">
                            Products
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">
                            Cart
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="offers.html">
                            Offers
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="tracking.html">
                            Track Order
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Heading -->

    <div class="container mt-5">

        <h2 class="text-center mb-3">

            🚚 Live Order Tracking

        </h2>

        <p class="text-center">

            Your grocery order is on the way.

        </p>

        <div id="map"></div>

    </div>

    <!-- Delivery Status -->

    <div class="container mt-4">

        <div class="card shadow">

            <div class="card-body text-center">

                <h4>Delivery Status</h4>

                <p id="status">

                    🚚 Delivery Partner has picked up your order.

                </p>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <footer class="bg-success text-white text-center p-3 mt-5">

        © 2026 QuickCart

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Leaflet JS -->

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Tracking JS -->

    <script src="js/tracking.js"></script>

</body>

</html>
