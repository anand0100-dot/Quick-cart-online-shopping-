<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>QuickCart Offers</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-success">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                🛒 QuickCart
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="products.html">Products</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="cart.html">Cart</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="offers.html">Offers</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="tracking.html">Track Order</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- Offers -->

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            🎉 Today's Special Offers
        </h2>

        <div class="row">

            <div class="col-md-4 mb-4">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h3>10% OFF</h3>

                        <p>Use Coupon Code</p>

                        <h4 class="text-success">SAVE10</h4>

                    </div>

                </div>

            </div>

            <div class="col-md-4 mb-4">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h3>20% OFF</h3>

                        <p>Use Coupon Code</p>

                        <h4 class="text-success">SAVE20</h4>

                    </div>

                </div>

            </div>

            <div class="col-md-4 mb-4">

                <div class="card shadow">

                    <div class="card-body text-center">

                        <h3>FREE DELIVERY</h3>

                        <p>Use Coupon Code</p>

                        <h4 class="text-success">FREESHIP</h4>

                    </div>

                </div>

            </div>

        </div>

        <!-- Coupon Input -->

        <div class="card mt-4 shadow">

            <div class="card-body">

                <h4>Apply Coupon</h4>

                <input type="text"
                    id="coupon"
                    class="form-control"
                    placeholder="Enter Coupon Code">

                <button
                    class="btn btn-success mt-3"
                    onclick="applyCoupon()">

                    Apply Coupon

                </button>

                <h5 class="mt-3" id="coupon-message"></h5>

            </div>

        </div>

    </div>

    <!-- Footer -->

    <footer class="bg-success text-white text-center p-3 mt-5">

        © 2026 QuickCart

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>

        function applyCoupon() {

            let code = document
                .getElementById("coupon")
                .value
                .toUpperCase();

            let msg = document.getElementById("coupon-message");

            if (code === "SAVE10") {

                msg.innerHTML = "✅ 10% Discount Applied!";
                msg.style.color = "green";

            }

            else if (code === "SAVE20") {

                msg.innerHTML = "✅ 20% Discount Applied!";
                msg.style.color = "green";

            }

            else if (code === "FREESHIP") {

                msg.innerHTML = "✅ Free Delivery Activated!";
                msg.style.color = "green";

            }

            else {

                msg.innerHTML = "❌ Invalid Coupon!";
                msg.style.color = "red";

            }

        }

    </script>

</body>

</html>
