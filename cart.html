<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-success">

        <div class="container">

            <a class="navbar-brand" href="index.html">
                🛒 QuickCart
            </a>

            <div>

                <a href="index.html" class="btn btn-light btn-sm">Home</a>

                <a href="products.html" class="btn btn-light btn-sm">Products</a>

                <a href="offers.html" class="btn btn-light btn-sm">Offers</a>

                <a href="tracking.html" class="btn btn-light btn-sm">Track Order</a>

            </div>

        </div>

    </nav>

    <!-- Heading -->

    <div class="container mt-5">

        <h2 class="text-center mb-4">
            🛒 Shopping Cart
        </h2>

        <!-- Cart Table -->

        <table class="table table-bordered table-striped">

            <thead class="table-success">

                <tr>

                    <th>Product</th>

                    <th>Price</th>

                    <th>Quantity</th>

                    <th>Total</th>

                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="cart-items">

            </tbody>

        </table>

        <!-- Grand Total -->

        <div class="text-end">

            <h3>

                Grand Total :
                <span id="total-price">
                    ₹0
                </span>

            </h3>

        </div>

        <!-- Buttons -->

        <div class="text-center mt-4">

            <button class="btn btn-danger"
                onclick="clearCart()">

                Clear Cart

            </button>

<button class="btn btn-success" onclick="checkout()">
    Checkout
</button>

        </div>

    </div>

    <!-- Footer -->

    <footer class="bg-success text-white text-center p-3 mt-5">

        © 2026 QuickCart

    </footer>

    <!-- Bootstrap JS -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Cart JS -->

    <script src="js/cart.js"></script>

</body>

</html>
